<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南ヶ丘MBC活動計画表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --orange: #f57c2c;
  --orange-light: #ffb56e;
  --orange-dark: #d96416;
  --cream: #fff7ec;
  --ink: #2a1f17;
  --paper: #fffdf7;
  --line: #e8dec9;
  --sat: #4ca7d8;
  --sun: #d65454;
  --green: #6aaa64;
  --shadow: 0 2px 8px rgba(42,31,23,.08);
  --shadow-lg: 0 8px 24px rgba(42,31,23,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.header {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
  color: white;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow);
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px;
  background: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.logo-text { font-weight: 800; font-size: 15px; letter-spacing: .03em; line-height: 1.1; }
.logo-sub { font-size: 10px; opacity: .9; font-family: 'Bebas Neue', sans-serif; letter-spacing: .15em; }
.user-chip {
  background: rgba(255,255,255,.2);
  padding: 5px 10px; border-radius: 16px;
  font-size: 12px; font-weight: 500;
  backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  border: 1px solid rgba(255,255,255,.3);
}

.tabs {
  display: flex;
  background: var(--paper);
  border-bottom: 2px solid var(--line);
  position: sticky; top: 64px; z-index: 40;
  overflow-x: auto;
}
.tab {
  flex: 1; min-width: 70px;
  padding: 10px 4px;
  font-weight: 700; font-size: 11px;
  color: #888;
  border-bottom: 3px solid transparent;
  transition: all .2s;
  white-space: nowrap;
}
.tab.active { color: var(--orange-dark); border-bottom-color: var(--orange); }
.tab-icon { display: block; font-size: 16px; margin-bottom: 2px; }

.month-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--paper); }
.month-nav button {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--cream); font-size: 18px; font-weight: 700; color: var(--orange-dark);
}
.month-nav button:active { background: var(--orange-light); }
.month-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.month-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--orange); line-height: 1; }
.note { font-size: 10px; color: #888; padding: 0 16px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.note > span { flex: 1; text-align: center; }
.note a { color: var(--orange-dark); text-decoration: underline; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--line);
  gap: 1px;
  border-top: 1px solid var(--line);
}
.dow-cell { background: var(--paper); text-align: center; padding: 6px 0; font-size: 11px; font-weight: 700; color: #666; }
.dow-cell.sat { color: var(--sat); }
.dow-cell.sun { color: var(--sun); }

.day-cell {
  background: var(--paper);
  min-height: 92px;
  padding: 3px;
  position: relative;
  display: flex; flex-direction: column;
  cursor: pointer;
}
.day-cell.other { background: #faf7f0; opacity: .5; }
.day-cell.today { background: linear-gradient(180deg, #fff4e0 0%, var(--paper) 100%); }
.day-cell.sat { background: #ecf6fb; }
.day-cell.sun { background: #fcefef; }
.day-cell.today.sat { background: linear-gradient(180deg, #d8ecf6 0%, #ecf6fb 100%); }
.day-cell.today.sun { background: linear-gradient(180deg, #f9dede 0%, #fcefef 100%); }

.day-num { font-family: 'Bebas Neue', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: .02em; }
.day-cell.sat .day-num { color: var(--sat); }
.day-cell.sun .day-num { color: var(--sun); }
.day-cell.today .day-num {
  background: var(--orange); color: white !important;
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px;
}

.event-tag {
  font-size: 9px; padding: 2px 3px; border-radius: 3px; margin-top: 2px;
  font-weight: 600; line-height: 1.25;
  overflow: hidden;
  white-space: normal;
  word-break: break-word;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.event-tag .ev-line {
  display: block;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  line-height: 1.2;
}
.event-tag .ev-line.title { font-weight: 800; }
.event-tag .ev-line.time, .event-tag .ev-line.place { opacity: .85; font-weight: 500; font-size: 8.5px; }
.event-tag .ev-line.time { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.event-tag.practice { background: #fde8c8; color: #a04e00; }
.event-tag.match { background: #ffd1c2; color: #9b2200; }
.event-tag.league { background: #d4e8d4; color: #2a6a2a; }
.event-tag.other { background: #e0e0e0; color: #444; }
.event-tag.key { background: #e0e6ff; color: #2b3a8c; }
.event-tag.duty { background: #ffe1e8; color: #9b1a3e; }

.bottom-sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none; animation: fadeIn .2s; }
.bottom-sheet.show { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet-body {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--paper);
  border-radius: 20px 20px 0 0;
  padding: 16px;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp .25s;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 12px; }
.sheet-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.sheet-date { font-size: 22px; font-weight: 800; color: var(--orange); line-height: 1.2; letter-spacing: .02em; }
.sheet-section { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.sheet-section:first-of-type { border-top: none; padding-top: 0; }
.sheet-label { font-size: 11px; font-weight: 700; color: #666; margin-bottom: 6px; letter-spacing: .05em; display: flex; align-items: center; justify-content: space-between; gap: 4px; }

.event-item {
  background: var(--cream);
  padding: 10px; border-radius: 10px; margin-bottom: 6px;
  display: flex; align-items: flex-start; gap: 8px;
  border-left: 3px solid var(--orange);
}
.event-item.key-item { border-left-color: #5c6dc4; }
.event-item.duty-item { border-left-color: #d65479; }
.event-item .type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap; }
.event-item .e-body { flex: 1; min-width: 0; }
.event-item .e-title { font-weight: 700; font-size: 13px; }
.event-item .e-meta { font-size: 11px; color: #666; margin-top: 2px; }
.event-item .e-actions { display: flex; gap: 4px; align-items: center; }
.event-item .e-del { color: #c00; font-size: 18px; padding: 4px 6px; font-weight: 300; line-height: 1; }
.event-item .e-edit { color: var(--orange-dark); font-size: 14px; padding: 4px 6px; }

.btn { background: var(--orange); color: white; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: transform .1s; }
.btn:active { transform: scale(.96); }
.btn.secondary { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: #e74c3c; }
.btn.small { padding: 6px 10px; font-size: 11px; }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px; font-family: inherit;
  background: white;
}
.field input:focus, .field select:focus { outline: 2px solid var(--orange); }
.time-row { display: flex; align-items: center; gap: 8px; }
.time-row input[type="time"] { flex: 1; font-size: 16px; font-weight: 700; text-align: center; }
.time-sep { font-size: 16px; font-weight: 700; color: #888; }

.type-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
.type-opt { padding: 10px 8px; border: 2px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center; background: white; }
.type-opt.active { border-color: var(--orange); background: #fff4e0; color: var(--orange-dark); }

.duty-container { padding: 12px; }
.duty-card { background: var(--paper); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.duty-week { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: #888; letter-spacing: .1em; }
.duty-date-big { font-size: 17px; font-weight: 800; margin: 2px 0 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.duty-pill { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.pill-key { background: #e0e6ff; color: #2b3a8c; }
.pill-duty { background: #ffe1e8; color: #9b1a3e; }
.pill-event { background: #fde8c8; color: #a04e00; font-size: 9px; }

/* スリムなリスト用 */
.duty-list {
  background: var(--paper);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 8px;
}
.duty-row-slim {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .15s;
}
.duty-row-slim:last-child { border-bottom: none; }
.duty-row-slim:active { background: var(--cream); }
.duty-row-slim .date-col {
  flex-shrink: 0;
  width: 50px;
  text-align: center;
  line-height: 1.1;
}
.duty-row-slim .date-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: .02em;
}
.duty-row-slim .date-dow { font-size: 10px; font-weight: 700; color: #888; }
.duty-row-slim.sat .date-num, .duty-row-slim.sat .date-dow { color: var(--sat); }
.duty-row-slim.sun .date-num, .duty-row-slim.sun .date-dow { color: var(--sun); }
.duty-row-slim.today { background: linear-gradient(90deg, #fff4e0 0%, var(--paper) 60%); }
.duty-row-slim.past { opacity: .55; }
.duty-row-slim.past .assign-main { font-weight: 700; }

.past-collapse {
  margin: 0;
  border-bottom: 1px solid var(--line);
  background: var(--cream);
}
.past-collapse > summary {
  list-style: none;
  padding: 8px 14px;
  font-size: 11px;
  font-weight: 700;
  color: #888;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.past-collapse > summary::-webkit-details-marker { display: none; }
.past-collapse > summary::before {
  content: '▸';
  font-size: 10px;
  transition: transform .15s;
}
.past-collapse[open] > summary::before { transform: rotate(90deg); }
.past-collapse > summary:active { background: var(--paper); }

.stats-collapse {
  margin: 200px 16px 16px;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--line);
  overflow: hidden;
}
.stats-collapse > summary {
  list-style: none;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 700;
  color: #555;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.stats-collapse > summary::-webkit-details-marker { display: none; }
.stats-collapse > summary::before {
  content: '▸';
  font-size: 10px;
  transition: transform .15s;
}
.stats-collapse[open] > summary::before { transform: rotate(90deg); }
.stats-collapse > summary:active { background: var(--cream); }
.stats-collapse > div { padding: 0 14px 14px; }

.stats-team-group { margin-bottom: 10px; }
.stats-team-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700;
  padding: 4px 0;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 4px;
  color: #666;
}
.stats-team-head .team-badge-inline { margin-right: 0; font-size: 10px; padding: 1px 6px; }
.stats-team-head .team-count {
  margin-left: auto; font-size: 10px; color: #888; font-weight: 600;
}
.stats-team-head .team-count b { color: #555; font-weight: 800; }
.stats-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 2px;
  font-size: 11px;
  color: #666;
}
.stats-row .name { font-weight: 600; }
.stats-row .count { font-size: 11px; font-weight: 700; color: #777; }
.stats-row .count b { font-size: 13px; font-weight: 800; color: var(--ink); margin-right: 1px; }
.stats-row .count.zero b { color: #ccc; }
.stats-period {
  font-size: 10px; color: #888; margin-bottom: 8px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.stats-period button {
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-size: 10px;
  font-weight: 700;
  color: #888;
  font-family: inherit;
}
.stats-period button.active { background: #ddd; color: #333; border-color: #ccc; }
.duty-row-slim .ev-col {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: 110px;
}
.duty-row-slim .ev-pill {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.duty-row-slim .assign-col {
  flex: 1;
  min-width: 0;
  line-height: 1.2;
}
.duty-row-slim .assign-main {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .03em;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.duty-row-slim .assign-sub {
  font-size: 10px;
  color: #888;
  font-weight: 500;
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.duty-row-slim .assign-empty { color: #bbb; font-size: 13px; font-weight: 600; }
.duty-row-slim .duty-names {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
  display: block;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  word-break: break-word;
}
.duty-row-slim .duty-names span { font-weight: 800 !important; }
.duty-row-slim .assign-team {
  font-size: 17px;
  font-weight: 800;
  margin-top: 2px;
  letter-spacing: .03em;
}
.swap-card-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin: 0 -4px;
  padding-left: 4px;
  padding-right: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.swap-card {
  flex: 0 0 auto;
  min-width: 88px;
  padding: 10px 10px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
}
.swap-card > * { pointer-events: none; }
.swap-card:active { background: var(--cream); border-color: var(--orange); }
.swap-card.active { background: #fff4e0; border-color: var(--orange); }
.swap-card.disabled { opacity: .35; pointer-events: none; }
.swap-card .d { font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: .02em; }
.swap-card .dow { font-size: 10px; font-weight: 700; color: #888; }
.swap-card.sat .d { color: var(--sat); }
.swap-card.sat .dow { color: var(--sat); }
.swap-card.sun .d { color: var(--sun); }
.swap-card.sun .dow { color: var(--sun); }
.swap-card .team-badge-inline { margin: 2px 0 0 0; font-size: 11px; padding: 2px 8px; }

.team-badge-inline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 10px;
  margin-right: 6px;
  letter-spacing: .03em;
  line-height: 1.2;
  flex-shrink: 0;
  vertical-align: middle;
}
.duty-row-slim .chevron { color: #ccc; font-size: 18px; flex-shrink: 0; }
.assign-main .row-team-dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,.6);
}

/* メンバー交換のボタン式UI */
.swap-pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
.swap-pick {
  padding: 10px 8px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700;
  text-align: left;
}
.swap-pick .team-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.swap-pick .sub { font-size: 10px; font-weight: 500; color: #888; margin-left: auto; }
.swap-pick.active { border-color: var(--orange); background: #fff4e0; color: var(--orange-dark); }
.swap-pick.disabled { opacity: .35; pointer-events: none; }
.swap-pick > * { pointer-events: none; }
.swap-pick:active { background: #fff4e0; }
.swap-step-label {
  font-size: 11px; font-weight: 700; color: var(--orange-dark);
  margin-top: 8px; margin-bottom: 4px; letter-spacing: .05em;
}

/* 大きな人名強調 */
.name-big {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .04em;
}
.name-medium {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .03em;
}

.duty-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
.duty-row:first-of-type { border-top: none; }
.duty-row .role { font-size: 11px; font-weight: 700; color: #666; min-width: 50px; }
.duty-row .members { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; }
.duty-row .swap-btn {
  background: var(--cream); border: 1px solid var(--line);
  padding: 4px 10px; border-radius: 14px;
  font-size: 11px; font-weight: 700; color: var(--orange-dark);
  white-space: nowrap;
}

.team-section { padding: 12px; }
.team-card { background: var(--paper); border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.team-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 6px; }
.team-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.team-badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: white; font-family: 'Bebas Neue', sans-serif; font-size: 16px;
  flex-shrink: 0;
}
.member-chip {
  display: inline-flex; align-items: center;
  background: var(--cream);
  padding: 5px 8px 5px 10px;
  border-radius: 16px;
  font-size: 12px; font-weight: 600;
  margin: 0 4px 4px 0; gap: 4px;
}
.member-chip .x {
  background: #ccc; color: white;
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}

.spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }

</style>
</head>

<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyAIYyl157-pOdkFkCIIUwPGha-d95ZjWLM",
  authDomain: "minamigaoka-schedule.firebaseapp.com",
  projectId: "minamigaoka-schedule",
  storageBucket: "minamigaoka-schedule.firebasestorage.app",
  messagingSenderId: "163832033621",
  appId: "1:163832033621:web:cf20206fab7134dc2bbfdc"
};

let db = null;
let USE_FIREBASE = false;

try {
  if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    USE_FIREBASE = true;
  }
} catch(e) {
  console.warn('Firebase init failed, using localStorage', e);
}

// ============ STATE ============
// events:  {"YYYY-MM-DD": [{id, type, title, time, place, teamId, memo}]}
// keyDuty: {"YYYY-MM-DD": {memberId}}  // 人単位
// duty:    {"YYYY-MM-DD": {teamId}}    // 班単位
// dutyMemberOverrides: {"YYYY-MM-DD": [{outMemberId, inMemberId}]}  // 設定済お当番のメンバー個別交換
let state = {
  events: {},
  keyDuty: {},
  duty: {},
  dutyMemberOverrides: {},
  teams: [
    { id: 'A', name: 'A班', color: '#e74c3c', members: [] },
    { id: 'B', name: 'B班', color: '#3498db', members: [] },
    { id: 'C', name: 'C班', color: '#27ae60', members: [] }
  ]
};

let viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedDate = null;
let editingEvent = null;
let editingType = 'practice';
let swapDraft = { outMemberId: null, targetKey: null, inMemberId: null };

const STORAGE_KEY = 'minamigaoka_schedule_v2';

async function loadData() {
  if (USE_FIREBASE) {
    try {
      const doc = await db.collection('app').doc('main').get();
      if (doc.exists) applySnapshot(doc.data());
      db.collection('app').doc('main').onSnapshot(snap => {
        if (snap.exists) { applySnapshot(snap.data()); render(); }
      });
      return;
    } catch(e) { console.warn('Firebase load failed, fallback to localStorage', e); }
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applySnapshot(JSON.parse(raw));
  } catch(e) { console.warn(e); }
}

function applySnapshot(data) {
  if (data.events) state.events = data.events;
  if (data.teams) {
    state.teams = data.teams.map(t => ({
      ...t,
      members: (t.members || []).map(m =>
        typeof m === 'string' ? { id: uid(), name: m } : m
      )
    }));
  }
  if (data.keyDuty) state.keyDuty = data.keyDuty;
  if (data.duty) state.duty = data.duty;
  if (data.dutyMemberOverrides) state.dutyMemberOverrides = data.dutyMemberOverrides;
}

async function saveData() {
  const payload = {
    events: state.events,
    teams: state.teams,
    keyDuty: state.keyDuty,
    duty: state.duty,
    dutyMemberOverrides: state.dutyMemberOverrides,
    updatedAt: new Date().toISOString()
  };
  if (USE_FIREBASE) {
    try { await db.collection('app').doc('main').set(payload); return; }
    catch(e) { console.warn('Firebase save failed, fallback to localStorage', e); }
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }
  catch(e) { console.warn(e); }
}

// ============ HELPERS ============
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isSameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function getTeam(id) { return state.teams.find(t => t.id === id); }
function getMember(memberId) {
  for (const t of state.teams) {
    const m = t.members.find(x => x.id === memberId);
    if (m) return { ...m, teamId: t.id, teamName: t.name, teamColor: t.color };
  }
  return null;
}
function parseTimeRange(timeStr) {
  if (!timeStr) return { start: '', end: '' };
  const m = timeStr.match(/^(\d{1,2}:\d{2})\s*[〜~\-]\s*(\d{1,2}:\d{2})$/);
  if (m) return { start: m[1], end: m[2] };
  const m1 = timeStr.match(/^(\d{1,2}:\d{2})$/);
  if (m1) return { start: m1[1], end: '' };
  return { start: '', end: '' };
}

function buildTimeRange(start, end) {
  if (!start && !end) return '';
  if (start && end) return `${start}〜${end}`;
  return start || end;
}

function escapeHTML(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 鍵当番が設定可能か: 木金で、かつ何らかの活動(練習・試合・大会試合)がある日
function canHaveKeyDuty(key) {
  const date = parseKey(key);
  const dow = date.getDay();
  if (dow !== 4 && dow !== 5) return false; // 木金のみ
  const evts = state.events[key] || [];
  return evts.some(e => e.type === 'practice' || e.type === 'match' || e.type === 'league');
}
function hasMatchOrLeague(key) {
  const evts = state.events[key] || [];
  return evts.some(e => e.type === 'match' || e.type === 'league');
}
function getWeekId(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return dateKey(d);
}

// 指定日のお当番メンバー(オーバーライド適用後)を返す
// 返り値: [{id, name, fromTeamName, isOverride}]
function getEffectiveDutyMembers(key) {
  const duty = state.duty[key];
  if (!duty) return [];
  const team = getTeam(duty.teamId);
  if (!team) return [];
  const overrides = state.dutyMemberOverrides[key] || [];
  // 元のメンバーから始めて、外す/入れるを適用
  let result = team.members.map(m => ({ id: m.id, name: m.name, fromTeamId: team.id, isOverride: false }));
  overrides.forEach(o => {
    // outMemberIdを外して、inMemberIdを追加
    result = result.filter(m => m.id !== o.outMemberId);
    const inMem = getMember(o.inMemberId);
    if (inMem) {
      result.push({ id: inMem.id, name: inMem.name, fromTeamId: inMem.teamId, isOverride: true });
    }
  });
  return result;
}

function formatEffectiveMembers(key) {
  const list = getEffectiveDutyMembers(key);
  if (!list.length) return '';
  return list.map(m => {
    const ot = state.teams.find(t => t.id === m.fromTeamId);
    const teamLabel = m.isOverride && ot ? `(${ot.name})` : '';
    return escapeHTML(m.name) + (teamLabel ? `<span style="color:#888;font-size:10px">${escapeHTML(teamLabel)}</span>` : '');
  }).join('、');
}

// ============ TABS ============
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  ['calendar','key','duty','team'].forEach(n => {
    document.getElementById('view-'+n).classList.toggle('hidden', n !== name);
  });
  if (name === 'key') renderKeyList();
  if (name === 'duty') renderDutyList();
  if (name === 'team') renderTeams();
}

// ============ CALENDAR ============
const DOW = ['日','月','火','水','木','金','土'];
function changeMonth(delta) {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+delta, 1);
  render();
}

function goToday() {
  const now = new Date();
  viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  render();
  toast('今月に戻りました');
}

function updateMonthLabels() {
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth() + 1;
  ['', 'Key', 'Duty'].forEach(suffix => {
    const yEl = document.getElementById('yearLabel' + suffix);
    const mEl = document.getElementById('monthLabel' + suffix);
    if (yEl) yEl.textContent = y;
    if (mEl) mEl.textContent = m;
  });
}

function renderCalendar() {
  updateMonthLabels();
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth();

  const grid = document.getElementById('calGrid');

  // 曜日ごとに当月の活動有無を集計し、無い曜日の列幅を狭める
  const daysInMonthForCount = new Date(y, m+1, 0).getDate();
  const hasActivityByDow = [false,false,false,false,false,false,false];
  for (let d = 1; d <= daysInMonthForCount; d++) {
    const date = new Date(y, m, d);
    const key = dateKey(date);
    const dow = date.getDay();
    if ((state.events[key] || []).length > 0 || state.keyDuty[key] || state.duty[key]) {
      hasActivityByDow[dow] = true;
    }
  }
  const colOrder = [1,2,3,4,5,6,0]; // 月火水木金土日
  grid.style.gridTemplateColumns = colOrder.map(idx => hasActivityByDow[idx] ? '1.15fr' : '0.7fr').join(' ');

  grid.innerHTML = '';
  [1,2,3,4,5,6,0].forEach(idx => {
    const cls = idx === 6 ? 'sat' : idx === 0 ? 'sun' : '';
    grid.insertAdjacentHTML('beforeend', `<div class="dow-cell ${cls}">${DOW[idx]}</div>`);
  });

  const firstDay = new Date(y, m, 1);
  const startDayJS = firstDay.getDay();
  const offset = startDayJS === 0 ? 6 : startDayJS - 1;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevMonthDays = new Date(y, m, 0).getDate();
  const today = new Date();

  for (let i = offset-1; i >= 0; i--) grid.insertAdjacentHTML('beforeend', renderDayCell(new Date(y, m-1, prevMonthDays-i), true));
  for (let d = 1; d <= daysInMonth; d++) grid.insertAdjacentHTML('beforeend', renderDayCell(new Date(y, m, d), false, today));
  const totalCells = offset + daysInMonth;
  const remain = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remain; i++) grid.insertAdjacentHTML('beforeend', renderDayCell(new Date(y, m+1, i), true));
}

function renderDayCell(date, isOther, today) {
  const dow = date.getDay();
  const key = dateKey(date);
  const evts = state.events[key] || [];
  const duty = state.duty[key];
  const keyDuty = state.keyDuty[key];
  let classes = 'day-cell';
  if (isOther) classes += ' other';
  if (today && isSameDay(date, today)) classes += ' today';
  if (dow === 6) classes += ' sat';
  if (dow === 0) classes += ' sun';

  let tagsHTML = '';
  evts.slice(0, 2).forEach(ev => {
    const label = ev.title || ({practice:'練習',match:'練習試合',league:'大会試合',other:''})[ev.type];
    const timeLine = ev.time ? `<span class="ev-line time">${escapeHTML(ev.time)}</span>` : '';
    const titleLine = `<span class="ev-line title">${escapeHTML(label)}</span>`;
    const placeLine = ev.place ? `<span class="ev-line place">@${escapeHTML(ev.place)}</span>` : '';
    tagsHTML += `<div class="event-tag ${ev.type}">${timeLine}${titleLine}${placeLine}</div>`;
  });
  if (evts.length > 2) tagsHTML += `<div class="event-tag" style="background:#eee;color:#888"><span class="ev-line">+${evts.length-2}</span></div>`;
  if (keyDuty) {
    const mem = getMember(keyDuty.memberId);
    tagsHTML += `<div class="event-tag key"><span class="ev-line title">🔑${mem ? escapeHTML(mem.name) : '?'}</span></div>`;
  }
  if (duty) {
    const team = getTeam(duty.teamId);
    if (team) tagsHTML += `<div class="event-tag duty"><span class="ev-line title">🔔${escapeHTML(team.name)}</span></div>`;
  }

  return `<div class="${classes}" onclick="openDay('${key}')">

      <div class="sheet-label"><span>🔑 鍵当番</span></div>
      <div class="event-item key-item">
        <div class="e-body">
          <div class="name-medium">${mem ? escapeHTML(mem.name) : '未割当'}</div>

      <div class="sheet-label"><span>🔔 お当番</span></div>

function closeSheet(id) {

// ============ ADD/EDIT EVENT ============
function openAddForm() {
  editingEvent = null;
  closeSheet('eventSheet');
  document.getElementById('addTitle').textContent = '予定を追加';
  document.getElementById('evTitle').value = '';
  document.getElementById('evPlace').value = '';
  document.getElementById('evMemo').value = '';
  setType('practice'); // 種類に応じた時間デフォルトもここで適用
  document.getElementById('addSheet').classList.add('show');
}

function editEvent(id) {
  const ev = (state.events[selectedDate] || []).find(e => e.id === id);
  if (!ev) return;
  closeSheet('eventSheet');
  editingEvent = ev;
  document.getElementById('addTitle').textContent = '予定を編集';
  document.getElementById('evTitle').value = ev.title || '';
  const parsed = parseTimeRange(ev.time);
  document.getElementById('evTimeStart').value = parsed.start;
  document.getElementById('evTimeEnd').value = parsed.end;
  document.getElementById('evPlace').value = ev.place || '';
  document.getElementById('evMemo').value = ev.memo || '';
  setType(ev.type);
  document.getElementById('addSheet').classList.add('show');
}

function setType(t) {
  editingType = t;
  document.querySelectorAll('.type-opt').forEach(el => el.classList.toggle('active', el.dataset.type === t));
  // 練習はタイトル不要
  const titleField = document.getElementById('titleField');
  if (titleField) titleField.style.display = (t === 'practice') ? 'none' : 'block';
  // 新規入力時のみ、種類に応じて時間デフォルトを適用
  if (!editingEvent) {
    const defaults = {
      practice: { start: '09:00', end: '12:00' },
      match:    { start: '07:30', end: '17:00' },
      league:   { start: '07:30', end: '17:00' },
      other:    { start: '', end: '' }
    };
    const d = defaults[t] || defaults.other;
    document.getElementById('evTimeStart').value = d.start;
    document.getElementById('evTimeEnd').value = d.end;
  }
}
document.querySelectorAll('#typePicker .type-opt').forEach(el => { el.onclick = () => setType(el.dataset.type); });

async function saveEvent() {
  let title = document.getElementById('evTitle').value.trim();
  if (editingType === 'practice') {
    if (!title) title = '練習';
  } else if (!title) {
    toast('タイトルを入力してください'); return;
  }
  const payload = {
    type: editingType,
    title,
    time: buildTimeRange(
      document.getElementById('evTimeStart').value,
      document.getElementById('evTimeEnd').value
    ),
    place: document.getElementById('evPlace').value.trim(),
    memo: document.getElementById('evMemo').value.trim()
  };
  if (editingEvent) {
    Object.assign(editingEvent, payload);
  } else {
    payload.id = uid();
    if (!state.events[selectedDate]) state.events[selectedDate] = [];
    state.events[selectedDate].push(payload);
  }
  cleanupAssignments(selectedDate);
  await saveData();
  closeSheet('addSheet');
  render();
  toast(editingEvent ? '更新しました' : '予定を追加しました');
  editingEvent = null;
}

async function deleteEvent(id) {
  if (!confirm('この予定を削除しますか?')) return;
  state.events[selectedDate] = (state.events[selectedDate] || []).filter(e => e.id !== id);
  if (!state.events[selectedDate].length) delete state.events[selectedDate];
  cleanupAssignments(selectedDate);
  await saveData();
  renderDayEvents();
  renderCalendar();
  toast('削除しました');
}

function cleanupAssignments(key) {
  if (!canHaveKeyDuty(key)) delete state.keyDuty[key];
  if (!hasMatchOrLeague(key)) delete state.duty[key];
}

// ============ DEFAULT PRACTICE FILL ============
async function fillDefaultPractices() {
  if (!confirm('この月の木曜・金曜にデフォルト練習(18:30〜21:00)を追加します。既存の練習がある日はスキップします。')) return;
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const dow = date.getDay();
    if (dow !== 4 && dow !== 5) continue;
    const key = dateKey(date);
    const existing = state.events[key] || [];
    if (existing.some(e => e.type === 'practice')) continue;
    if (!state.events[key]) state.events[key] = [];
    state.events[key].push({
      id: uid(), type: 'practice', title: '練習', time: '18:30〜21:00', place: '', teamId: '', memo: ''
    });
    count++;
  }
  await saveData();
  closeSheet('settingsSheet');
  render();
  toast(`${count}件追加しました`);
}

function renderKeyList() {

  const m = viewMonth.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let pastRows = '';
  let pastCount = 0;
  let currentRows = '';
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);

    const kd = state.keyDuty[key];

    const isPast = past ? ' past' : '';
    const evts = state.events[key] || [];
    const evPills = evts.slice(0,2).map(e => {
      const lbl = e.title || ({practice:'練習',match:'練習試合',league:'大会試合',other:'その他'})[e.type];
      const cls = e.type;
      return `<span class="ev-pill ${cls}" style="background:${({practice:'#fde8c8',match:'#ffd1c2',league:'#d4e8d4',other:'#e0e0e0'})[e.type]};color:${({practice:'#a04e00',match:'#9b2200',league:'#2a6a2a',other:'#444'})[e.type]}">${escapeHTML(lbl)}</span>`;

    const placeText = evts.find(e => e.place)?.place || '';
    const row = `<div class="duty-row-slim${dowCls}${isToday}${isPast}" onclick="openKeyAssign('${key}')">

    else { currentRows += row; }

  if (pastCount) {
    html += `<details class="past-collapse"><summary>過去 ${pastCount} 件を表示</summary>${pastRows}</details>`;
  }
  html += currentRows + '</div>';
  if (!count) html = '<div class="empty"><div class="icon">📭</div><div class="text">木金で練習のある日がありません。</div></div>';

function openKeyAssign(key) {
  const date = parseKey(key);
  const current = state.keyDuty[key];
  const container = document.getElementById('keyContent');

  let html = `<div class="sheet-section">
    <div class="sheet-label"><span>📅 ${date.getMonth()+1}月${date.getDate()}日 (${DOW[date.getDay()]})</span></div>

  state.teams.forEach(t => {
    t.members.forEach(m => {
      const active = current && current.memberId === m.id;
      html += `<button class="member-pick ${active?'active':''}" onclick="assignKey('${key}','${m.id}')">
        <span class="team-dot" style="background:${t.color}"></span>

      </button>`;
    });

      <button class="btn danger full" onclick="clearKey('${key}')">割当を解除</button>
    </div>`;
  }

  container.innerHTML = html;
  closeSheet('eventSheet');

async function assignKey(key, memberId) {
  const date = parseKey(key);
  const dow = date.getDay();
  state.keyDuty[key] = { memberId };

  // 木曜の場合、同週の金曜に練習があれば同じ人を割当
  let linkedFriday = false;
  if (dow === 4) {
    const friDate = new Date(date);
    friDate.setDate(friDate.getDate() + 1);
    const friKey = dateKey(friDate);
    if (canHaveKeyDuty(friKey)) {
      state.keyDuty[friKey] = { memberId };
      linkedFriday = true;
    }
  }
  await saveData();
  closeSheet('keySheet');
  render();
  const mem = getMember(memberId);
  const memName = mem ? mem.name : '担当';
  if (linkedFriday) {
    toast(`鍵当番に${memName}さんを設定(金曜も同じ人を自動セット)`);
  } else {
    toast(`鍵当番に${memName}さんを設定しました`);
  }
}

async function clearKey(key) {
  const date = parseKey(key);
  const cur = state.keyDuty[key];
  const memName = cur ? (getMember(cur.memberId)?.name || '担当') : '';
  if (!confirm(`${date.getMonth()+1}月${date.getDate()}日の鍵当番(${memName})を解除します。よろしいですか?`)) return;
  delete state.keyDuty[key];
  await saveData();
  closeSheet('keySheet');
  render();
  toast('解除しました');
}

  state.teams.forEach(t => {

async function doAutoRotate(startTeamId) {
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const startIdx = state.teams.findIndex(t => t.id === startTeamId);
  if (startIdx < 0) return;
  let idx = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const key = dateKey(date);
    if (!hasMatchOrLeague(key)) continue;
    const team = state.teams[(startIdx + idx) % state.teams.length];
    state.duty[key] = { teamId: team.id };
    // 個別オーバーライドは自動割当でリセット
    delete state.dutyMemberOverrides[key];
    idx++;
  }
  await saveData();
  closeSheet('dutySheet');
  render();
  toast(`${getTeam(startTeamId).name}から自動割当しました`);
}

function openDutyAssign(key) {
  const date = parseKey(key);
  const current = state.duty[key];
  const container = document.getElementById('dutyContent');

  let html = `<div class="sheet-section">
    <div class="sheet-label"><span>📅 ${date.getMonth()+1}月${date.getDate()}日 (${DOW[date.getDay()]})</span></div>`;
  if (current) {
    const curTeam = getTeam(current.teamId);
    const eff = getEffectiveDutyMembers(key);
    html += `<div style="font-size:13px;font-weight:700;color:${curTeam?curTeam.color:'inherit'};margin-bottom:4px">担当: ${curTeam?escapeHTML(curTeam.name):'不明'}</div>`;
    if (eff.length) {
      html += `<div style="font-size:12px;color:#555">${formatEffectiveMembers(key)}</div>`;
    } else {
      html += `<div style="font-size:12px;color:#888">メンバー未登録</div>`;
    }
  } else {
    html += `<div style="font-size:13px;color:#888">未割当</div>`;
  }
  html += `</div>`;

  if (current) {
    // 既存の個別交換の表示
    const overrides = state.dutyMemberOverrides[key] || [];
    if (overrides.length) {
      html += `<div class="sheet-section"><div class="sheet-label"><span>📝 現在の個別交換</span></div>`;
      overrides.forEach(o => {
        const outMem = getMember(o.outMemberId);
        const inMem = getMember(o.inMemberId);
        const pairLabel = o.pairKey ? (() => {
          const p = parseKey(o.pairKey);
          return `${p.getMonth()+1}/${p.getDate()}(${DOW[p.getDay()]}) と双方向交換`;
        })() : 'この日のみ代行';
        html += `<div class="swap-target">
          <div style="font-size:13px;font-weight:700">
            ${outMem?escapeHTML(outMem.name):'(削除済)'} ⇄ ${inMem?escapeHTML(inMem.name):'(削除済)'}
          </div>
          <div class="info">${escapeHTML(pairLabel)}</div>
          <button class="btn secondary small" onclick="clearMemberOverride('${key}','${o.outMemberId}')">この交換を取消</button>
        </div>`;
      });
      html += `</div>`;
    }

    // ① 他の試合日と双方向で人を交換
    const eff = getEffectiveDutyMembers(key);
    if (eff.length) {
      html += `<div class="sheet-section"><div class="sheet-label"><span>👤 他の試合日と人を入替え</span><span style="font-size:10px;color:#888;font-weight:500">前後1ヶ月以内</span></div>`;
      html += `<div style="font-size:11px;color:#888;margin-bottom:8px">この日の担当と、別の試合日の担当を双方向で交換します。班の構成は変わりません。</div>`;

      // STEP 1: この日から外す人
      html += `<div class="swap-step-label">STEP 1 / この日から外す人</div>`;
      html += `<div class="swap-pick-grid">`;
      eff.forEach(m => {
        const t = getTeam(m.fromTeamId);
        const active = swapDraft.outMemberId === m.id;
        html += `<button class="swap-pick ${active?'active':''}" onclick="selectSwapOut('${key}','${m.id}')">
          <span class="team-dot" style="background:${t?t.color:'#ccc'}"></span>
          <span>${escapeHTML(m.name)}</span>
          <span class="sub">${escapeHTML(t?t.name:'')}</span>
        </button>`;
      });
      html += `</div>`;

      // STEP 2: 交換相手の試合日
      const baseTime = date.getTime();
      const RANGE_MS = 30 * 24 * 60 * 60 * 1000;
      const dayCandidates = Object.keys(state.duty)
        .filter(ok => ok !== key)
        .filter(ok => hasMatchOrLeague(ok))
        .map(ok => ({ ok, d: parseKey(ok) }))
        .filter(c => Math.abs(c.d.getTime() - baseTime) <= RANGE_MS)
        .sort((a, b) => a.d - b.d);

      if (dayCandidates.length) {
        const step2Enabled = !!swapDraft.outMemberId;
        html += `<div class="swap-step-label" style="opacity:${step2Enabled?1:.4}">STEP 2 / 交換相手の試合日</div>`;
        html += `<div class="swap-card-scroll">`;
        dayCandidates.forEach(({ ok, d: other }) => {
          const od = state.duty[ok];
          const ot = getTeam(od.teamId);
          const dow = other.getDay();
          const dowCls = dow === 6 ? 'sat' : dow === 0 ? 'sun' : '';
          const active = swapDraft.targetKey === ok;
          const cls = step2Enabled ? (active?'active':'') : 'disabled';
          html += `<button class="swap-card ${dowCls} ${cls}" onclick="selectSwapTargetDay('${key}','${ok}')">
            <span class="d">${other.getMonth()+1}/${other.getDate()}</span>
            <span class="dow">(${DOW[dow]})</span>
            <span class="team-badge-inline" style="background:${ot?ot.color:'#999'}">${ot?escapeHTML(ot.name):'?'}</span>
          </button>`;
        });
        html += `</div>`;

        // STEP 3: 相手日から代わりに来てもらう人
        if (swapDraft.targetKey) {
          const targetEff = getEffectiveDutyMembers(swapDraft.targetKey);
          const thisDayIds = new Set(eff.map(m => m.id));
          const inCandidates = targetEff.filter(m => !thisDayIds.has(m.id));
          html += `<div class="swap-step-label">STEP 3 / 代わりに来てもらう人</div>`;
          if (inCandidates.length) {
            html += `<div class="swap-pick-grid">`;
            inCandidates.forEach(m => {
              const t = getTeam(m.fromTeamId);
              const active = swapDraft.inMemberId === m.id;
              html += `<button class="swap-pick ${active?'active':''}" onclick="selectSwapIn('${key}','${m.id}')">
                <span class="team-dot" style="background:${t?t.color:'#ccc'}"></span>
                <span>${escapeHTML(m.name)}</span>
                <span class="sub">${escapeHTML(t?t.name:'')}</span>
              </button>`;
            });
            html += `</div>`;
            const ready = swapDraft.outMemberId && swapDraft.targetKey && swapDraft.inMemberId;
            html += `<button class="btn full" style="margin-top:10px;opacity:${ready?1:.4}" ${ready?'':'disabled'}
              onclick="doMemberSwapDirect('${key}','${swapDraft.outMemberId||''}','${swapDraft.targetKey||''}','${swapDraft.inMemberId||''}')">
              双方向に交換する
            </button>`;
          } else {
            html += '<div style="font-size:12px;color:#888;padding:8px">交換できる人がいません(この日と相手日に同じ人が含まれています)</div>';
          }
        }
      } else {
        html += `<div style="font-size:11px;color:#888;padding:8px">前後1ヶ月以内に他の試合日がありません</div>`;
      }
      html += `</div>`;
    }

    // ② 班同士の入替え (基準日から±30日以内の試合日)
    const baseTime = date.getTime();
    const RANGE_MS = 30 * 24 * 60 * 60 * 1000;
    const candidates = Object.keys(state.duty)
      .filter(ok => ok !== key)
      .filter(ok => hasMatchOrLeague(ok))
      .map(ok => ({ ok, date: parseKey(ok) }))
      .filter(c => Math.abs(c.date.getTime() - baseTime) <= RANGE_MS)
      .sort((a, b) => a.date - b.date);

    if (candidates.length) {
      let teamSwapHtml = '';
      candidates.forEach(({ ok, date: other }) => {
        const od = state.duty[ok];
        const ot = getTeam(od.teamId);
        const dow = other.getDay();
        const dowCls = dow === 6 ? 'sat' : dow === 0 ? 'sun' : '';
        teamSwapHtml += `<button class="swap-card ${dowCls}" onclick="doDutySwap('${key}','${ok}')">
          <span class="d">${other.getMonth()+1}/${other.getDate()}</span>
          <span class="dow">(${DOW[dow]})</span>
          <span class="team-badge-inline" style="background:${ot?ot.color:'#999'}">${ot?escapeHTML(ot.name):'?'}</span>
        </button>`;
      });
      html += `<div class="sheet-section"><div class="sheet-label"><span>🔁 他の試合日と班同士で入替え</span><span style="font-size:10px;color:#888;font-weight:500">前後1ヶ月以内</span></div>
        <div class="swap-card-scroll">${teamSwapHtml}</div></div>`;
    }
  }

  // ③ 班を割当 / 変更
  html += `<div class="sheet-section"><div class="sheet-label"><span>👥 班を割当 / 変更</span></div>`;
  state.teams.forEach(t => {
    const isCurrent = current && current.teamId === t.id;
    const memberPreview = t.members.length ? t.members.map(m => escapeHTML(m.name)).join('、') : 'メンバー未登録';
    html += `<button class="btn full" style="background:${t.color};margin-bottom:6px;opacity:${isCurrent?0.5:1};flex-direction:column;align-items:flex-start;padding:10px 12px" 
      onclick="assignDutyTeam('${key}','${t.id}')" ${isCurrent?'disabled':''}>
      <span style="font-weight:800">${escapeHTML(t.name)} ${isCurrent?'(現在)':''}</span>
      <span style="font-size:10px;font-weight:500;opacity:.9;text-align:left;line-height:1.3">${memberPreview}</span>
    </button>`;
  });
  html += `</div>`;

  if (current) {
    html += `<div class="sheet-section">
      <button class="btn danger full" onclick="clearDuty('${key}')">割当を解除</button>
    </div>`;
  }

  container.innerHTML = html;
  closeSheet('eventSheet');
  document.getElementById('dutySheet').classList.add('show');
}

async function assignDutyTeam(key, teamId) {
  const date = parseKey(key);
  const label = `${date.getMonth()+1}月${date.getDate()}日`;
  const newTeam = getTeam(teamId);
  const newName = newTeam ? newTeam.name : '不明';
  const cur = state.duty[key];
  let msg;
  if (cur) {
    const curTeam = getTeam(cur.teamId);
    const curName = curTeam ? curTeam.name : '不明';
    const hasOv = (state.dutyMemberOverrides[key] || []).length > 0;
    msg = `${label}のお当番を ${curName} から ${newName} に変更します。よろしいですか?` +
      (hasOv ? '\n\n※この日の個別交換は解除されます。' : '');
  } else {
    msg = `${label}のお当番を ${newName} に割り当てます。よろしいですか?`;
  }
  if (!confirm(msg)) return;
  // 班を変更した場合、その日のオーバーライドはクリア
  if (state.duty[key] && state.duty[key].teamId !== teamId) {
    delete state.dutyMemberOverrides[key];
  }
  state.duty[key] = { teamId };
  await saveData();
  closeSheet('dutySheet');
  render();
  toast('お当番を設定しました');
}

async function doDutySwap(keyA, keyB) {
  const a = state.duty[keyA];
  const b = state.duty[keyB];
  if (!a || !b) return;
  const dA = parseKey(keyA), dB = parseKey(keyB);
  const lA = `${dA.getMonth()+1}/${dA.getDate()}(${DOW[dA.getDay()]})`;
  const lB = `${dB.getMonth()+1}/${dB.getDate()}(${DOW[dB.getDay()]})`;
  const tA = getTeam(a.teamId), tB = getTeam(b.teamId);
  const nA = tA ? tA.name : '不明', nB = tB ? tB.name : '不明';
  const hasOv = (state.dutyMemberOverrides[keyA] || []).length > 0 || (state.dutyMemberOverrides[keyB] || []).length > 0;
  if (!confirm(`${lA}と${lB}のお当番を班同士で入替えます。よろしいですか?\n\n${lA}: ${nA} → ${nB}\n${lB}: ${nB} → ${nA}` +
    (hasOv ? '\n\n※両日の個別交換は解除されます。' : ''))) return;
  state.duty[keyA] = { teamId: b.teamId };
  state.duty[keyB] = { teamId: a.teamId };
  // 入替え時はオーバーライドもクリア
  delete state.dutyMemberOverrides[keyA];
  delete state.dutyMemberOverrides[keyB];
  await saveData();
  closeSheet('dutySheet');
  render();
  toast('入替えました');
}

function selectSwapOut(key, memberId) {
  swapDraft.outMemberId = (swapDraft.outMemberId === memberId) ? null : memberId;
  // 外す人を変えたら相手日と入れる人はリセット
  swapDraft.targetKey = null;
  swapDraft.inMemberId = null;
  openDutyAssign(key);
}

function selectSwapTargetDay(key, targetKey) {
  if (!swapDraft.outMemberId) return;
  swapDraft.targetKey = (swapDraft.targetKey === targetKey) ? null : targetKey;
  // 相手日を変えたら入れる人はリセット
  swapDraft.inMemberId = null;
  openDutyAssign(key);
}

function selectSwapIn(key, memberId) {
  if (!swapDraft.outMemberId || !swapDraft.targetKey) return;
  swapDraft.inMemberId = (swapDraft.inMemberId === memberId) ? null : memberId;
  openDutyAssign(key);
}

async function doMemberSwapDirect(key, fromId, targetKey, toId) {
  if (!fromId || !targetKey || !toId) return;
  const fromMem = getMember(fromId);
  const toMem = getMember(toId);
  if (!fromMem || !toMem) { toast('メンバーが見つかりません'); return; }
  const tDate = parseKey(targetKey);
  const tLabel = `${tDate.getMonth()+1}/${tDate.getDate()}`;
  const date = parseKey(key);
  const kLabel = `${date.getMonth()+1}/${date.getDate()}`;
  if (!confirm(`${kLabel}の${fromMem.name} と ${tLabel}の${toMem.name} を双方向で交換します。よろしいですか?\n\n${kLabel}: ${fromMem.name} → ${toMem.name}\n${tLabel}: ${toMem.name} → ${fromMem.name}`)) return;

  // この日: fromMember を toMember に置換
  if (!state.dutyMemberOverrides[key]) state.dutyMemberOverrides[key] = [];
  state.dutyMemberOverrides[key] = state.dutyMemberOverrides[key].filter(o => o.outMemberId !== fromId);
  state.dutyMemberOverrides[key].push({ outMemberId: fromId, inMemberId: toId, pairKey: targetKey });

  // 相手日: toMember を fromMember に置換
  if (!state.dutyMemberOverrides[targetKey]) state.dutyMemberOverrides[targetKey] = [];
  state.dutyMemberOverrides[targetKey] = state.dutyMemberOverrides[targetKey].filter(o => o.outMemberId !== toId);
  state.dutyMemberOverrides[targetKey].push({ outMemberId: toId, inMemberId: fromId, pairKey: key });

  swapDraft = { outMemberId: null, targetKey: null, inMemberId: null };
  await saveData();
  closeSheet('dutySheet');
  render();
  toast(`${kLabel} ${fromMem.name} ⇄ ${tLabel} ${toMem.name}`);
}

async function clearMemberOverride(key, outMemberId) {
  const list = state.dutyMemberOverrides[key] || [];
  const ov = list.find(o => o.outMemberId === outMemberId);
  if (!ov) return;
  // 双方向交換の場合は相手日のオーバーライドも解除
  state.dutyMemberOverrides[key] = list.filter(o => o.outMemberId !== outMemberId);
  if (!state.dutyMemberOverrides[key].length) delete state.dutyMemberOverrides[key];
  if (ov.pairKey) {
    const pairList = state.dutyMemberOverrides[ov.pairKey] || [];
    state.dutyMemberOverrides[ov.pairKey] = pairList.filter(o => !(o.outMemberId === ov.inMemberId && o.inMemberId === ov.outMemberId && o.pairKey === key));
    if (!state.dutyMemberOverrides[ov.pairKey].length) delete state.dutyMemberOverrides[ov.pairKey];
  }
  await saveData();
  openDutyAssign(key);
  render();
  toast(ov.pairKey ? '双方向交換を解除しました' : '交換を解除しました');
}

async function clearDuty(key) {
  const date = parseKey(key);
  const cur = state.duty[key];
  const teamName = cur ? (getTeam(cur.teamId)?.name || '担当班') : '';
  const overrides = (state.dutyMemberOverrides[key] || []).length;
  const extra = overrides ? `\n(個別交換${overrides}件も解除されます)` : '';
  if (!confirm(`${date.getMonth()+1}月${date.getDate()}日のお当番(${teamName})を解除します。よろしいですか?${extra}`)) return;
  delete state.duty[key];
  delete state.dutyMemberOverrides[key];
  await saveData();
  closeSheet('dutySheet');
  render();
  toast('解除しました');
}

// ============ TEAM MANAGE ============
let statsPeriod = 'all'; // 'all' | 'thisMonth' | 'last3'

function setStatsPeriod(p) {
  statsPeriod = p;
  renderDutyStats();
}

function renderDutyStats() {
  const container = document.getElementById('dutyStats');
  if (!container) return;

  // 集計対象の duty キー
  let dutyKeys = Object.keys(state.duty);
  const now = new Date();
  const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const last3Start = new Date(now.getFullYear(), now.getMonth()-2, 1);

  if (statsPeriod === 'thisMonth') {
    const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
    dutyKeys = dutyKeys.filter(k => {
      const d = parseKey(k);
      return d >= thisMonthStart && d < end;
    });
  } else if (statsPeriod === 'last3') {
    const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
    dutyKeys = dutyKeys.filter(k => {
      const d = parseKey(k);
      return d >= last3Start && d < end;
    });
  }

  // メンバーIDごとに実担当回数を集計 (オーバーライド適用後)
  const countByMember = {};
  dutyKeys.forEach(k => {
    const eff = getEffectiveDutyMembers(k);
    eff.forEach(m => {
      countByMember[m.id] = (countByMember[m.id] || 0) + 1;
    });
  });
  // 班ごとの「班としての担当回数」を集計 (raw: state.duty の teamId 一致数)
  const countByTeam = {};
  dutyKeys.forEach(k => {
    const tid = state.duty[k]?.teamId;
    if (tid) countByTeam[tid] = (countByTeam[tid] || 0) + 1;
  });

  const periodLabel = statsPeriod === 'thisMonth' ? '今月' : statsPeriod === 'last3' ? '直近3ヶ月' : '全期間';

  let html = `<div class="stats-period">
    <span style="margin-right:auto;align-self:center">集計範囲:</span>
    <button class="${statsPeriod==='thisMonth'?'active':''}" onclick="setStatsPeriod('thisMonth')">今月</button>
    <button class="${statsPeriod==='last3'?'active':''}" onclick="setStatsPeriod('last3')">直近3ヶ月</button>
    <button class="${statsPeriod==='all'?'active':''}" onclick="setStatsPeriod('all')">全期間</button>
  </div>`;

  if (!state.teams.length) {
    html += '<div style="font-size:12px;color:#888;padding:8px">班が登録されていません</div>';
    container.innerHTML = html;
    return;
  }

  state.teams.forEach(t => {
    const teamRaw = countByTeam[t.id] || 0;
    html += `<div class="stats-team-group">
      <div class="stats-team-head">
        <span class="team-badge-inline" style="background:${t.color}">${escapeHTML(t.name)}</span>
        <span class="team-count">班担当 <b>${teamRaw}</b>回</span>
      </div>`;
    if (!t.members.length) {
      html += '<div style="font-size:10px;color:#aaa;padding:2px 4px">メンバー未登録</div>';
    } else {
      t.members.forEach(m => {
        const c = countByMember[m.id] || 0;
        html += `<div class="stats-row">
          <span class="name">${escapeHTML(m.name)}</span>
          <span class="count ${c?'':'zero'}"><b>${c}</b>回</span>
        </div>`;
      });
    }
    html += `</div>`;
  });

  html += `<div style="font-size:9px;color:#bbb;margin-top:4px;line-height:1.4">※「班担当」は班単位の割当回数、各人の回数は個別交換適用後の実担当 / 範囲: ${periodLabel}</div>`;
  container.innerHTML = html;
}

function renderTeams() {
  const container = document.getElementById('teamList');
  document.getElementById('teamCountLabel').textContent = `${state.teams.length}班で運用中`;
  renderDutyStats();
  let html = '';
  state.teams.forEach((t, idx) => {
    html += `<div class="team-card">
      <div class="team-head">
        <div class="team-name">
          <div class="team-badge" style="background:${t.color}">${escapeHTML(t.id)}</div>
          <input type="text" value="${escapeHTML(t.name)}" 
            style="border:none;background:transparent;font-size:16px;font-weight:800;width:100%;min-width:0"
            onchange="renameTeam(${idx}, this.value)">
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn secondary small" onclick="pickColor(${idx})">🎨</button>
          <button class="btn danger small" onclick="removeTeam(${idx})">削除</button>
        </div>
      </div>
      <div>
        ${t.members.map((m, i) => `<span class="member-chip">
          ${escapeHTML(m.name)}
          <span class="x" onclick="removeMember(${idx},${i})">×</span>
        </span>`).join('')}
        ${!t.members.length ? '<span style="color:#aaa;font-size:12px">メンバー未登録</span>' : ''}
      </div>
      <div class="add-input-row">
        <input type="text" placeholder="メンバー名を入力" id="memInput-${idx}" onkeydown="if(event.key==='Enter')addMember(${idx})">
        <button class="btn small" onclick="addMember(${idx})">追加</button>
      </div>
    </div>`;
  });
  if (!html) html = '<div class="empty"><div class="icon">👥</div><div class="text">班を追加してください</div></div>';
  container.innerHTML = html;
}

async function addTeam() {
  const nextChar = String.fromCharCode(65 + state.teams.length);
  const colors = ['#e74c3c','#3498db','#27ae60','#f39c12','#9b59b6','#1abc9c','#e91e63'];
  state.teams.push({ id: nextChar, name: `${nextChar}班`, color: colors[state.teams.length % colors.length], members: [] });
  await saveData();
  renderTeams();
}

async function removeTeam(idx) {
  if (state.teams.length <= 1) { toast('班は最低1つ必要です'); return; }
  if (!confirm(`${state.teams[idx].name}を削除しますか?`)) return;
  state.teams.splice(idx, 1);
  await saveData();
  renderTeams();
  render();
}

async function renameTeam(idx, name) {
  state.teams[idx].name = name;
  await saveData();
  render();
}

async function pickColor(idx) {
  const c = prompt('カラーコードを入力 (例: #e74c3c)', state.teams[idx].color);
  if (!c) return;
  state.teams[idx].color = c;
  await saveData();
  renderTeams();
  render();
}

async function addMember(idx) {
  const input = document.getElementById(`memInput-${idx}`);
  const name = input.value.trim();
  if (!name) return;
  state.teams[idx].members.push({ id: uid(), name });
  await saveData();
  renderTeams();
}

async function removeMember(tIdx, mIdx) {
  const mem = state.teams[tIdx].members[mIdx];
  if (!mem) return;
  // 関連割当の件数をカウント
  let keyCount = 0;
  Object.keys(state.keyDuty).forEach(k => {
    if (state.keyDuty[k].memberId === mem.id) keyCount++;
  });
  let overrideCount = 0;
  Object.keys(state.dutyMemberOverrides).forEach(k => {
    overrideCount += (state.dutyMemberOverrides[k] || []).filter(
      o => o.outMemberId === mem.id || o.inMemberId === mem.id
    ).length;
  });
  let msg = `${mem.name} を削除しますか?`;
  if (keyCount || overrideCount) {
    const extras = [];
    if (keyCount) extras.push(`鍵当番 ${keyCount} 件`);
    if (overrideCount) extras.push(`個別交換 ${overrideCount} 件`);
    msg += `\n(${extras.join(' / ')} も同時に解除されます)`;
  }
  if (!confirm(msg)) return;
  const memberId = mem.id;
  state.teams[tIdx].members.splice(mIdx, 1);
  Object.keys(state.keyDuty).forEach(k => {
    if (state.keyDuty[k].memberId === memberId) delete state.keyDuty[k];
  });
  // dutyMemberOverridesから関連エントリを削除
  Object.keys(state.dutyMemberOverrides).forEach(k => {
    state.dutyMemberOverrides[k] = state.dutyMemberOverrides[k].filter(
      o => o.outMemberId !== memberId && o.inMemberId !== memberId
    );
    if (!state.dutyMemberOverrides[k].length) delete state.dutyMemberOverrides[k];
  });
  await saveData();
  renderTeams();
  render();
}
